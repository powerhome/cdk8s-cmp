apiVersion: argoproj.io/v1alpha1
kind: ConfigManagementPlugin
metadata:
  name: krane-cmp
spec:
  discover:
    fileName: ./cdk8s.yaml
  generate:
    args:
    - --stdout
    command:
    - cdk8s
    - synth
  init:
    args:
    - import
    command:
    - cdk8s
  preserveFileMode: false
  provideGitCreds: true
  version: "1.0"
